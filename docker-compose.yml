services:
  frontend:
    image: 'benssoon/fi-lo-games-frontend:latest'
    container_name: fi-lo-front
    ports:
      - "3000:3000"

  backend:
    image: 'benssoon/fi-lo-games-backend:latest'
    container_name: fi-lo-back
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/compose-postgres
      - SPRING_DATASOURCE_USERNAME=compose-postgres
      - POSTGRESQL_PASSWORD=compose-postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - FILO_IMAGES=/app/image-uploads
    ports:
      - "8080:8080"

  db:
    image: 'postgres:14.22-alpine'
    container_name: fi-lo-db
    environment:
      - POSTGRES_USER=compose-postgres
      - POSTGRES_PASSWORD=compose-postgres
